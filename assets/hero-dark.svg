<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="PullDay: never skip pull day. Keeps Claude Code, Codex, Gemini CLI, OpenCode and Cursor add-ons up to date.">
