  <g transform="translate(20,20) scale(0.508)">
    <rect x="50" y="56" width="412" height="412" rx="92" fill="#000000" fill-opacity="0.12"/>
    <rect x="50" y="50" width="412" height="412" rx="92" fill="#15181F"/>
