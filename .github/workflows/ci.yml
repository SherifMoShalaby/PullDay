name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Typecheck (warnings are errors)
        run: swiftc -typecheck -warnings-as-errors -swift-version 5 -parse-as-library -target arm64-apple-macos13.0 Sources/*.swift
      - name: Self-test
        run: ./build.sh --test
      - name: Build
        run: ./build.sh

  # The Rust core of the Linux app (rust/), on Linux and macOS.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      # The runner images ship rustup; take the current stable rather than whatever the image has.
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c clippy -c rustfmt && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Format
        run: cargo fmt --check
      - name: Lint (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --locked --release

  # The Linux app (rust/pullday-linux), which needs WebKitGTK; Linux only.
  linux-app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev desktop-file-utils
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-linux-app-v2-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-linux-app-v2-
      - name: Lint (warnings are errors)
        run: cargo clippy -p pullday-linux --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test -p pullday-linux --locked
      - name: Package (.deb)
        run: pullday-linux/package-deb.sh "$RUNNER_TEMP"
      - name: Check the package
        run: pullday-linux/check-deb.sh "$RUNNER_TEMP"/PullDay-*-amd64.deb
      # On a clean 24.04, Depends only: every linked library resolves and loads, and reinstall and remove work.
      - name: Install smoke test (ubuntu:24.04)
        run: |
          docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$RUNNER_TEMP:/w" ubuntu:24.04 sh -ec '
            apt-get update
            deb=$(ls /w/PullDay-*-amd64.deb)
            v=${deb#/w/PullDay-}; v=${v%-amd64.deb}
            apt-get install -y --no-install-recommends "$deb"
            test "$(pullday --version)" = "PullDay $v"
            apt-get install -y --no-install-recommends --reinstall "$deb"
            apt-get remove -y pullday
            test ! -e /usr/bin/pullday'
