<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PullDay Log</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js" defer></script>
  <script src="log.js" defer></script>
</head>
<body class="window log-window">
  <div id="empty" class="log-empty secondary" hidden>Nothing logged yet. Checks and updates show up here.</div>
  <div id="entries" class="entries"></div>
  <footer class="log-footer">
    <button id="open-file">Open Log File</button>
    <span class="spacer"></span>
    <button id="clear">Clear</button>
  </footer>
</body>
</html>
